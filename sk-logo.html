<!-- SK Financial Planning logo: paste this block anywhere inside <body> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  .sk-logo {
    display: inline-flex;
    align-items: center;
    gap: 24px;
    font-family: 'Jost', sans-serif;
    color: #0E2A47;
  }
  .sk-logo__mark { width: 96px; height: auto; flex-shrink: 0; }
  .sk-logo__text { display: flex; flex-direction: column; gap: 8px; }
  .sk-logo__name {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    white-space: nowrap;
  }
  .sk-logo__sub { display: flex; align-items: center; gap: 10px; }
  .sk-logo__rule { height: 2px; background: #B08D3C; }
  .sk-logo__rule--short { width: 24px; }
  .sk-logo__rule--long { flex-grow: 1; }
  .sk-logo__planning {
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.52em;
    margin-right: -0.52em;
  }
  @media (max-width: 480px) {
    .sk-logo { gap: 14px; }
    .sk-logo__mark { width: 64px; }
    .sk-logo__name { font-size: 26px; }
    .sk-logo__planning { font-size: 10px; }
  }
</style>

<div class="sk-logo">
  <svg class="sk-logo__mark" viewBox="0 0 200 232" role="img" aria-label="SK Financial Planning monogram">
    <path d="M100 6 L186 34 V112 C186 164 148 204 100 226 C52 204 14 164 14 112 V34 Z" fill="#0E2A47"/>
    <path d="M100 18 L174 42 V112 C174 156 142 192 100 212 C58 192 26 156 26 112 V42 Z" fill="none" stroke="#C9A24B" stroke-width="2"/>
    <text x="100" y="112" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="68" letter-spacing="2" fill="#F7F4EC">SK</text>
    <rect x="64" y="123" width="72" height="2" fill="#C9A24B"/>
    <rect x="72" y="168" width="14" height="14" fill="#C9A24B"/>
    <rect x="93" y="156" width="14" height="26" fill="#C9A24B"/>
    <rect x="114" y="142" width="14" height="40" fill="#C9A24B"/>
    <rect x="66" y="184" width="68" height="2" fill="#C9A24B"/>
  </svg>
  <div class="sk-logo__text">
    <div class="sk-logo__name">SK Financial</div>
    <div class="sk-logo__sub">
      <span class="sk-logo__rule sk-logo__rule--short"></span>
      <span class="sk-logo__planning">PLANNING</span>
      <span class="sk-logo__rule sk-logo__rule--long"></span>
    </div>
  </div>
</div>
